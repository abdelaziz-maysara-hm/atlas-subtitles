# Builds the Windows app. Runs manually (Actions tab -> Run workflow) or on a tag like v0.1.0.
name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: Unit tests
        run: python -m pytest -q tests/test_core.py

      - name: Fetch FFmpeg (BtbN, GPL build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          curl.exe -L $url -o ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          foreach ($n in @("ffmpeg.exe", "ffprobe.exe")) {
            $f = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter $n | Select-Object -First 1
            if (-not $f) { throw "$n not found" }
            Copy-Item $f.FullName -Destination $n
          }
          $lic = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName -Destination FFmpeg-LICENSE.txt } else { Write-Warning "FFmpeg LICENSE not found in zip" }
          ./ffmpeg.exe -hide_banner -filters | Select-String "subtitles"

      - name: Build
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Smoke test the built app (bundled ffmpeg + tiny model download + GUI start)
        shell: pwsh
        run: |
          $app = "build_out/Atlas_Subtitles/Atlas_Subtitles.exe"
          ./ffmpeg.exe -v error -y -f lavfi -i "sine=frequency=300:duration=3" -f lavfi -i "color=black:s=320x240:d=3" -shortest t.mp4
          $p = Start-Process $app -ArgumentList "--selftest", "t.mp4", "selftest.json", "tiny" -Wait -PassThru
          Get-Content selftest.json
          $r = Get-Content selftest.json -Raw | ConvertFrom-Json
          # a pure tone has no speech, so "no_speech" proves ffmpeg + model download + ctranslate2 all work
          if (-not ($r.ok -or "$($r.error)" -match "no_speech")) { throw "selftest failed" }
          $g = Start-Process $app -PassThru
          Start-Sleep -Seconds 20
          if ($g.HasExited) { throw "GUI exited early with code $($g.ExitCode)" }
          Stop-Process -Id $g.Id

      - name: Speech self-test (Windows TTS clip -> frozen app -> tiny model)
        shell: pwsh
        run: |
          $app = "build_out/Atlas_Subtitles/Atlas_Subtitles.exe"
          $wav = Join-Path $PWD "speech.wav"
          $tts = @'
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile($args[0])
          $s.Speak("Hello and welcome. This is a short test of the automatic subtitles program. It should write these words on the screen.")
          $s.Dispose()
          '@
          Set-Content -Path tts.ps1 -Value $tts
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tts.ps1 $wav
          if (-not (Test-Path $wav)) { Write-Warning "Windows TTS not available on this runner; skipping speech test"; exit 0 }
          $p = Start-Process $app -ArgumentList "--selftest", "`"$wav`"", "speech.json", "tiny" -Wait -PassThru
          Get-Content speech.json
          $r = Get-Content speech.json -Raw | ConvertFrom-Json
          if (-not $r.ok -or $r.segments.Count -lt 1) { throw "speech selftest failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: Atlas_Subtitles_Win
          path: dist/*.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
